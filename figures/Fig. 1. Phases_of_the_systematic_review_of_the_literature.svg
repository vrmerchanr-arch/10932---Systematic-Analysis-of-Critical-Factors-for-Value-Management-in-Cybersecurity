<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1000" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3F8FD"/>
      <stop offset="100%" stop-color="#CFE1F5"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="14" markerHeight="14" refX="8" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2E5FA3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2560" height="1000" fill="#FFFFFF"/>

  <!-- ================= PANEL 1 ================= -->
  <g>
    <rect x="60" y="60" width="740" height="880" rx="36" ry="36"
          fill="url(#panelFill)" stroke="#1F4E79" stroke-width="7"/>
    <rect x="100" y="100" width="660" height="170" rx="24" ry="24" fill="#1B4F8C"/>
    <text x="430" y="168" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="bold">Phase 1 &#8211;</text>
    <text x="430" y="232" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="bold">Planning the Review</text>

    <circle cx="150" cy="425" r="9" fill="#111111"/>
    <text x="180" y="440" fill="#111111" font-size="44">Define research questions</text>

    <circle cx="150" cy="545" r="9" fill="#111111"/>
    <text x="180" y="560" fill="#111111" font-size="44">Develop review protocol</text>

    <circle cx="150" cy="665" r="9" fill="#111111"/>
    <text x="180" y="680" fill="#111111" font-size="44">Set inclusion and</text>
    <text x="180" y="735" fill="#111111" font-size="44">exclusion criteria</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="812" y1="500" x2="895" y2="500" stroke="#2E5FA3" stroke-width="10" marker-end="url(#arrowHead)"/>

  <!-- ================= PANEL 2 ================= -->
  <g>
    <rect x="910" y="60" width="740" height="880" rx="36" ry="36"
          fill="url(#panelFill)" stroke="#1F4E79" stroke-width="7"/>
    <rect x="950" y="100" width="660" height="170" rx="24" ry="24" fill="#1B4F8C"/>
    <text x="1280" y="168" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="bold">Phase 2 &#8211;</text>
    <text x="1280" y="232" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="bold">Conducting the Review</text>

    <circle cx="1000" cy="420" r="9" fill="#111111"/>
    <text x="1030" y="435" fill="#111111" font-size="44">Search academic databases</text>

    <circle cx="1000" cy="530" r="9" fill="#111111"/>
    <text x="1030" y="545" fill="#111111" font-size="44">Select primary studies</text>

    <circle cx="1000" cy="640" r="9" fill="#111111"/>
    <text x="1030" y="655" fill="#111111" font-size="44">Assess study quality</text>

    <circle cx="1000" cy="750" r="9" fill="#111111"/>
    <text x="1030" y="765" fill="#111111" font-size="44">Extract relevant data</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="1662" y1="500" x2="1745" y2="500" stroke="#2E5FA3" stroke-width="10" marker-end="url(#arrowHead)"/>

  <!-- ================= PANEL 3 ================= -->
  <g>
    <rect x="1760" y="60" width="740" height="880" rx="36" ry="36"
          fill="url(#panelFill)" stroke="#1F4E79" stroke-width="7"/>
    <rect x="1800" y="100" width="660" height="170" rx="24" ry="24" fill="#1B4F8C"/>
    <text x="2130" y="168" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="bold">Phase 3 &#8211;</text>
    <text x="2130" y="232" text-anchor="middle" fill="#FFFFFF" font-size="54" font-weight="bold">Reporting the Review</text>

    <circle cx="1850" cy="425" r="9" fill="#111111"/>
    <text x="1880" y="440" fill="#111111" font-size="44">Synthesize findings</text>

    <circle cx="1850" cy="545" r="9" fill="#111111"/>
    <text x="1880" y="560" fill="#111111" font-size="44">Analyze and discuss results</text>

    <circle cx="1850" cy="665" r="9" fill="#111111"/>
    <text x="1880" y="680" fill="#111111" font-size="44">Present conclusions</text>
  </g>
</svg>
